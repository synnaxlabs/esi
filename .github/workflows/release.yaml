name: Release ESI Blob

on:
  push:
    branches:
      - main
    paths:
      - "beckhoff/**"
      - "dewesoft/**"
      - "parser/**"
      - "supplements/**"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: parser/go.mod
          cache-dependency-path: parser/go.sum

      - name: Generate Registry Blob
        working-directory: parser
        run: |
          go run . -catalog ../vendors.json -output-dir ../generated

      - name: Calculate SHA256
        id: sha
        run: |
          SHA256=$(sha256sum generated/registry_blob.inc | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
          SETTINGS_SHA256=$(sha256sum generated/registry_settings.inc | awk '{print $1}')
          echo "settings_sha256=$SETTINGS_SHA256" >> $GITHUB_OUTPUT

      - name: Compute Release Tag
        id: tag
        run: echo "tag=registry-$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT

      - name: Get Blob Size
        id: size
        run: |
          SIZE=$(ls -lh generated/registry_blob.inc | awk '{print $5}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ESI Registry Blob ${{ steps.tag.outputs.tag }}
          body: |
            ## ESI Registry Blob

            Auto-generated from ESI XML files.

            **SHA256:** `${{ steps.sha.outputs.sha256 }}`
            **Size:** ${{ steps.size.outputs.size }}

            ### Usage in Bazel

            ```python
            http_file(
                name = "esi_registry_blob",
                urls = ["https://github.com/synnaxlabs/esi/releases/download/${{ steps.tag.outputs.tag }}/registry_blob.inc"],
                sha256 = "${{ steps.sha.outputs.sha256 }}",
                downloaded_file_path = "registry_blob.inc",
            )
            http_file(
                name = "esi_registry_settings",
                urls = ["https://github.com/synnaxlabs/esi/releases/download/${{ steps.tag.outputs.tag }}/registry_settings.inc"],
                sha256 = "${{ steps.sha.outputs.settings_sha256 }}",
                downloaded_file_path = "registry_settings.inc",
            )
            ```
          files: |
            generated/registry_blob.inc
            generated/registry_settings.inc
            generated/registry_stats.json
          draft: false
          prerelease: false
          make_latest: false
